<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact | Golden Aura</title>
  <meta name="description" content="Contact Golden Aura.">
  <meta name="theme-color" content="#31583b">

  <link rel="icon" href="images/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@1,600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header id="site-header"></header>
  <main>
    <section class="page-banner">
      <div>
        <h1>Contact Us</h1>
        <p>We'd love to hear from you</p>
      </div>
    </section>

    <div class="container">
      <div class="contact">
        <div class="contact-info">
          <h3>Get in Touch</h3>
          <p>📍 Kochi, Kerala, India</p>
          <p>✉️ hello@goldenaura.example</p>
          <p>📞 +91 00000 00000</p>
          <p>Ask us about rare plants, vegetable seedlings, tubers, spices or bulk orders.</p>
        </div>

        <form class="cform" id="contact-form" novalidate>
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name">
            <div class="err"></div>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
            <div class="err"></div>
          </div>
          <div>
            <label for="topic">Topic</label>
            <select id="topic">
              <option>Plants</option>
              <option>Vegetable &amp; Tubers</option>
              <option>Spices</option>
              <option>Orders</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="How can we help?"></textarea>
            <div class="err"></div>
          </div>
          <button class="btn btn-fill" type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/main.js"></script>
  <script src="../js/plants.js"></script>
  <script src="../js/vegetable.js"></script>
  <script src="../js/vegetableseed.js"></script>
  <script src="../js/spices.js"></script>
  <script src="../js/animation.js"></script>
</body>
</html>
